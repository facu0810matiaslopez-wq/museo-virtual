<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Descubrí técnicas y materiales usados por artistas a lo largo de la historia.">
<title>Técnicas artísticas | Museo Virtual</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #101010;
    color: #f5f0e8;
    font-family: Arial, sans-serif;
    line-height: 1.7;
  }
  header {
    padding: 22px 7%;
    border-bottom: 1px solid #39332c;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .logo {
    font: 26px Georgia, serif;
    color: #e9c98e;
  }
  nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  a {
    color: #e9c98e;
    text-decoration: none;
  }
  nav a {
    color: #eee;
  }
  a:hover {
    color: #fff;
  }
  main {
    max-width: 1100px;
    margin: auto;
    padding: 55px 24px;
  }
